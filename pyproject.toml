[project]
name = "ai-reel-factory"
version = "0.1.0"
description = "AI-powered short-form video production platform — local-first, multi-brand"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD — see LICENSES.md" }

[project.urls]
Repository = "https://github.com/your-org/ai-reel-factory"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Phase 1 spike dependencies (audio + subtitle generation + QC)
# Full backend dependencies added in Phase 2
# ---------------------------------------------------------------------------
[project.optional-dependencies]
spike = [
    "piper-tts>=1.2.0",
    "faster-whisper>=1.1.0",
    "pydantic>=2.7",
    "rich>=13.7",
]

backend = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "celery[redis]>=5.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "rich>=13.7",
]
