[project]
name = "ai-reel-factory"
version = "0.1.0"
description = "AI-powered short-form video production platform — local-first, multi-brand"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD — see LICENSES.md" }
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "pillow>=10.3.0",
    "piper-tts>=1.2.0",
    "faster-whisper>=1.0.0",
    "ffmpeg-python>=0.2.0",
    "duckduckgo-search>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
]

[project.urls]
Repository = "https://github.com/your-org/ai-reel-factory"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
project-excludes = [".venv", "storage", "assets", "spikes"]
search-path = [
    "d:/Projects/ai-reel-factory",
    "d:/Projects/ai-reel-factory/src",
    "C:/Users/HP/AppData/Roaming/Python/Python314/site-packages",
    "C:/Python314/Lib/site-packages",
]

# ---------------------------------------------------------------------------
# Phase 1 spike dependencies (audio + subtitle generation + QC)
# Full backend dependencies added in Phase 2
# ---------------------------------------------------------------------------
[project.optional-dependencies]
spike = [
    "piper-tts>=1.2.0",
    "faster-whisper>=1.1.0",
    "pydantic>=2.7",
    "rich>=13.7",
]

backend = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "celery[redis]>=5.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "rich>=13.7",
]

