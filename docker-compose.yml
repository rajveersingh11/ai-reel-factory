version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: reelfactory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reelfactory
      POSTGRES_PASSWORD: reelfactory
      POSTGRES_DB: reelfactory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 120M  # Enforce 8 GB RAM discipline

  redis:
    image: redis:7-alpine
    container_name: reelfactory-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 50M   # Enforce 8 GB RAM discipline

volumes:
  postgres_data:

